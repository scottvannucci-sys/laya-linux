name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch wheel
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: CPU test suite
        run: pytest tests/unit tests/parity tests/integration tests/offline -q
        env:
          # Upstream parity references are not staged in CI; those tests skip.
          LAYA_UPSTREAM_COMMON: ${{ runner.temp }}/not-staged/common.py
